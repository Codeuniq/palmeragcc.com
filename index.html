<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>We've Moved!</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#1F4D3A;
}

/* MAIN PAGE */
.moved-page{
    min-height:100vh;
    width:100%;
    background:#1F4D3A;
    color:#f7f3e8;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;
    padding:40px 20px;
}

/* COMPANY LOGO */
.company-logo{
    position:absolute;
    top:30px;
    left:40px;
    z-index:100;
}

.company-logo img{
    width:150px;
    height:80px;

    object-fit:contain;
    object-position:left center;

    display:block;
}

/* BACKGROUND GLOW */
.moved-page::before{
    content:"";
    position:absolute;

    width:700px;
    height:700px;

    background:radial-gradient(
        circle,
        rgba(255,255,255,0.05),
        transparent 65%
    );

    top:-300px;
    left:-250px;

    border-radius:50%;
}

.moved-page::after{
    content:"";
    position:absolute;

    width:600px;
    height:600px;

    background:radial-gradient(
        circle,
        rgba(255,255,255,0.04),
        transparent 65%
    );

    bottom:-350px;
    right:-200px;

    border-radius:50%;
}


/* DECORATIVE LEAVES */
.leaf{
    position:absolute;
    opacity:0.08;
    pointer-events:none;
}

.leaf span{
    position:absolute;

    width:180px;
    height:45px;

    background:#d8b77a;

    border-radius:100% 0 100% 0;

    transform-origin:left center;
}

.leaf-top{
    top:30px;
    right:40px;

    width:350px;
    height:250px;

    transform:rotate(15deg);
}

.leaf-top span:nth-child(1){
    transform:rotate(10deg);
}

.leaf-top span:nth-child(2){
    transform:rotate(35deg);
}

.leaf-top span:nth-child(3){
    transform:rotate(60deg);
}

.leaf-top span:nth-child(4){
    transform:rotate(85deg);
}


.leaf-bottom{
    bottom:50px;
    left:0;

    width:350px;
    height:250px;

    transform:rotate(190deg);
}

.leaf-bottom span:nth-child(1){
    transform:rotate(10deg);
}

.leaf-bottom span:nth-child(2){
    transform:rotate(35deg);
}

.leaf-bottom span:nth-child(3){
    transform:rotate(60deg);
}

.leaf-bottom span:nth-child(4){
    transform:rotate(85deg);
}


/* CONTENT */
.content{
    width:100%;
    max-width:950px;

    text-align:center;

    position:relative;
    z-index:5;
}


/* LOCATION ICON */
.location-icon{
    width:120px;
    height:120px;

    margin:0 auto 35px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.pin{
    width:58px;
    height:78px;

    border:4px solid #d8b77a;

    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);

    position:relative;
}

.pin::after{
    content:"";

    position:absolute;

    width:22px;
    height:22px;

    border:4px solid #d8b77a;

    border-radius:50%;

    top:15px;
    left:15px;
}


/* TITLE */
h1{
    font-family:Georgia, "Times New Roman", serif;

    font-size:clamp(60px, 9vw, 110px);

    font-weight:500;

    letter-spacing:-3px;

    color:#f5f2e8;

    line-height:1;

    margin-bottom:35px;

    text-shadow:0 4px 20px rgba(0,0,0,0.12);
}


/* DIVIDER */
.divider{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:20px;

    margin:20px auto 32px;

    max-width:540px;
}

.divider .line{
    height:1px;
    flex:1;

    background:#cfae72;
    opacity:0.8;
}

.divider .dot{
    width:15px;
    height:15px;

    background:#d8b77a;

    border-radius:50%;
}


/* SUBTITLE */
.subtitle{
    font-size:clamp(24px, 3vw, 38px);

    font-weight:300;

    letter-spacing:1px;

    color:rgba(255,255,255,0.85);

    margin-bottom:35px;
}


/* WEBSITE BOX */
.website-box{
    width:fit-content;
    max-width:100%;

    margin:0 auto 45px;

    padding:25px 50px;

    border:2px solid #d8b77a;

    border-radius:18px;

    background:rgba(0,0,0,0.06);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.12),
        inset 0 0 30px rgba(255,255,255,0.02);

    transition:0.3s ease;
}

.website-box:hover{
    transform:translateY(-4px);

    box-shadow:0 15px 45px rgba(0,0,0,0.2);
}

.website-box a{
    font-size:clamp(38px, 6vw, 70px);

    font-weight:700;

    color:#d8b77a;

    text-decoration:none;

    letter-spacing:1px;

    word-break:break-word;
}


/* HEART */
.heart{
    font-size:35px;
    color:#d8b77a;
    margin:10px 0 20px;
}


/* THANK YOU */
.thank-you{
    font-size:clamp(22px, 3vw, 35px);

    font-weight:300;

    letter-spacing:1px;

    color:rgba(255,255,255,0.85);
}


/* MOBILE RESPONSIVE */
@media(max-width:600px){

    .moved-page{
        padding:100px 18px 60px;
    }

    /* LOGO MOBILE */
    .company-logo{
        top:20px;
        left:20px;
    }

    .company-logo img{
        width:120px;
        height:60px;
    }

    .location-icon{
        transform:scale(0.8);
        margin-bottom:15px;
    }

    h1{
        letter-spacing:-2px;
        margin-bottom:25px;
    }

    .subtitle{
        line-height:1.4;
        margin-bottom:25px;
    }

    .website-box{
        padding:22px 15px;
        width:100%;
    }

    .website-box a{
        font-size:clamp(28px, 9vw, 38px);
    }

    .thank-you{
        line-height:1.5;
    }

    .leaf-top{
        right:-100px;
        top:0;
    }

    .leaf-bottom{
        left:-150px;
        bottom:0;
    }

}

</style>
</head>


<body>

<section class="moved-page">


    <!-- =========================
         COMPANY LOGO - TOP LEFT
    ========================== -->

    <div class="company-logo">

        <!-- CHANGE logo.png TO YOUR LOGO FILE -->
        <img src="images/logohd.webp" alt="Company Logo">

    </div>


    <!-- DECORATIVE LEAVES -->

    <div class="leaf leaf-top">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <div class="leaf leaf-bottom">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- MAIN CONTENT -->

    <div class="content">


        <!-- LOCATION ICON -->

        <div class="location-icon">
            <div class="pin"></div>
        </div>


        <!-- TITLE -->

        <h1>We’ve Moved!</h1>


        <!-- TOP DIVIDER -->

        <div class="divider">

            <div class="line"></div>

            <div class="dot"></div>

            <div class="line"></div>

        </div>


        <!-- WEBSITE TEXT -->

        <div class="subtitle">
            Please visit our new website:
        </div>


        <!-- WEBSITE LINK -->

        <div class="website-box">

            <a href="https://palmera.gallery" target="_blank">
                palmera.gallery
            </a>

        </div>


        <!-- BOTTOM DIVIDER -->

        <div class="divider">

            <div class="line"></div>

            <div class="heart">♥</div>

            <div class="line"></div>

        </div>


        <!-- THANK YOU -->

        <div class="thank-you">
            Thank you for your continued support.
        </div>


    </div>


</section>

</body>
</html>
